version: "2"
linters:
  default: all
  disable:
    - goconst # this linter has gone noisy. Disabled
    - depguard
    - err113
    - funlen
    - godox
    - gomoddirectives
    - gomodguard
    - gomodguard_v2
    - exhaustruct
    - exhaustruct_v5
    - nlreturn
    - nonamedreturns
    - noinlineerr
    - paralleltest
    - recvcheck
    - testpackage
    - thelper
    - tparallel
    - varnamelen
    - whitespace
    - wrapcheck
    - wsl
    - wsl_v5
    # for scanner
    - gocyclo
    - cyclop
    - gocognit
    - maintidx
  settings:
    dupl:
      threshold: 200
    goconst:
      min-len: 8
      min-occurrences: 3
    cyclop:
      max-complexity: 22
    gocyclo:
      min-complexity: 22
    gocognit:
      min-complexity: 35
    exhaustive:
      default-signifies-exhaustive: true
      default-case-required: true
    lll:
      line-length: 180
  exclusions:
    generated: lax
    rules:
      # G115, int -> int32, at every len() and utf8.RuneCount in the package.
      #
      # The scanner holds its counters in int32, the type token.Position conveys, so nothing narrows on the way to a
      # token -- but everything the standard library hands back is int, so the narrowing moved to the 62 places that
      # read a length. Each is bounded by the length of the source, which Scanner.Init caps below math.MaxInt32.
      # See source.go.
      - linters:
          - gosec
        text: "G115"
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - .worktrees
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    # local prefixes regroup imports from these packages
    goimports:
      local-prefixes:
        - github.com/go-openapi
  exclusions:
    generated: lax
    paths:
      - .worktrees
      - third_party$
      - builtin$
      - examples$
issues:
  # Maximum issues count per one linter.
  # Set to 0 to disable.
  # Default: 50
  max-issues-per-linter: 0
  # Maximum count of issues with the same text.
  # Set to 0 to disable.
  # Default: 3
  max-same-issues: 0
